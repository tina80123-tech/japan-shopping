<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dce7ed"><title>日本購物手帳</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans TC',sans-serif;color:#332b30;background:#f9f5f1}*{box-sizing:border-box}body{margin:0}main{max-width:680px;margin:auto;padding:24px 18px 110px}.eyebrow{font-size:12px;letter-spacing:3px;color:#a5767b;font-weight:700}h1{font-size:32px;letter-spacing:1px;margin:8px 0}p{color:#81767a;font-size:14px}.hero{background:linear-gradient(135deg,#fff,#f8e9e5);padding:24px;border-radius:28px;box-shadow:0 10px 30px #8d596214}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}.stat{background:#ffffffb8;padding:12px;border-radius:16px}.stat b{display:block;font-size:19px}.stat span{font-size:11px;color:#8b7d80}.toolbar{display:flex;gap:8px;margin:22px 0 12px}input,select,textarea{font:inherit;border:1px solid #e8ddda;border-radius:13px;padding:12px;background:white;color:#342d30;min-width:0}input[type=search]{flex:1;width:100%}button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:#a45e6e;color:white;font-weight:650}button.secondary{background:#f1e4e4;color:#8e5160}button.ghost{background:transparent;color:#9b6470;padding:8px}button:active{transform:scale(.98)}.tabs{display:flex;gap:8px;overflow:auto;padding-bottom:12px}.tab{white-space:nowrap;background:#fff;color:#806e73;border:1px solid #f0e5e5;padding:9px 15px}.tab.active{background:#a45e6e;color:white}.list{display:grid;gap:12px}.item{background:white;border:1px solid #f0e6e2;border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;box-shadow:0 5px 15px #55444408}.thumb{width:74px;height:78px;object-fit:cover;border-radius:13px;background:#f8eeee;display:grid;place-items:center;font-size:30px;flex-shrink:0}.item-info{flex:1;min-width:0}.item h3{margin:0 0 5px;font-size:16px;overflow-wrap:anywhere}.meta{font-size:12px;color:#95888c;line-height:1.8}.price{font-weight:750;color:#a45e6e;margin-top:4px}.item-actions{display:flex;flex-direction:column;gap:6px}.item-actions button{font-size:12px;padding:8px}.bought{opacity:.64}.bought h3{text-decoration:line-through}.empty{text-align:center;padding:50px 15px;color:#9c858b}.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:640px;width:calc(100% - 36px);box-shadow:0 8px 24px #a45e6e55;font-size:16px;padding:16px}dialog{border:0;border-radius:24px;padding:0;width:calc(100% - 24px);max-width:530px;max-height:88vh;overflow:auto;box-shadow:0 20px 80px #34232b50}dialog::backdrop{background:#28191b8c}.modal{padding:24px}.modal h2{margin:0 0 16px}.fields{display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:13px;color:#73646b}.fields input,.fields select,.fields textarea{width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}.hint{font-size:12px;color:#8d7c80}.settings{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:16px 0}.settings input{width:105px}.footer{font-size:12px;text-align:center;margin:25px 0;color:#9d9091}@media(max-width:360px){.thumb{width:55px;height:64px}.item{gap:8px;padding:10px}.item-actions button{padding:7px}}

.settle{margin:18px 0;padding:18px;border:1px solid #d6e4ec;border-radius:22px;background:#f9fcfdeb}.settle h2{font-size:19px;margin:0 0 7px;color:#29465a}.settle-note{font-size:12px;color:#698394;margin:0 0 12px}.settle-row{padding:13px 0;border-top:1px solid #e0eaf0;display:flex;align-items:center;gap:10px}.settle-row>div{flex:1;min-width:0}.settle-row strong{display:block;color:#365568}.settle-row small{color:#728a98;line-height:1.6}.settle-row button{font-size:12px;padding:9px 11px}.settle-summary{font-weight:700;color:#436b83;margin-top:12px}.settle-empty{font-size:13px;color:#8095a2}.tag-paid{color:#447c6d}.tag-due{color:#a36a4e}
</style></head><body><main><section class="hero"><div class="eyebrow">JAPAN SHOPPING JOURNAL ✿</div><h1>日本購物手帳</h1><p>把想買的、替親友帶的，都好好收進清單裡 ♡</p><div class="stats"><div class="stat"><b id="total">0</b><span>清單商品</span></div><div class="stat"><b id="done">0</b><span>已購買</span></div><div class="stat"><b id="spent">¥0</b><span>已花日圓</span></div></div></section><div class="settings"><label class="hint">匯率 1 日圓 ≈ NT$ <input id="rate" type="number" min="0" step="0.001" value="0.22" aria-label="日圓台幣匯率"></label><span id="twd" class="hint"></span></div><div class="toolbar"><input type="search" id="search" placeholder="搜尋商品、品牌、購買地點…" aria-label="搜尋"><button class="secondary" id="export">備份</button><button class="secondary" id="import">匯入</button><input type="file" id="importFile" accept="application/json" hidden></div><div class="tabs" id="tabs"></div><section class="settle" id="settlement"><h2>🧾 親友代購結算</h2><p class="settle-note">只計算已購買的代購商品，依目前設定匯率換算台幣。</p><div id="settleList"></div><div class="settle-summary" id="settleSummary"></div></section><div class="list" id="list"></div><div class="footer">資料儲存在這台裝置的瀏覽器中 · 建議定期備份</div></main><button class="fab" id="add">＋ 新增購物商品</button><dialog id="editor"><form id="form" class="modal"><h2 id="modalTitle">新增商品</h2><div class="fields"><label>商品名稱 *<input id="name" required maxlength="100" placeholder="例如：日本藥妝、伴手禮"></label><label>品牌 / 日文名稱<input id="brand" maxlength="100" placeholder="方便向店員詢問"></label><div class="pair"><label>分類<select id="category"><option>美妝保養</option><option>藥妝保健</option><option>零食伴手禮</option><option>服飾配件</option><option>生活雜貨</option><option>其他</option></select></label><label>用途<select id="purpose"><option>自己購物</option><option>親友代購</option></select></label></div><label>代購人（親友代購時填寫）<input id="person" maxlength="80" placeholder="例如：媽媽、朋友 A"></label><div class="pair"><label>單價（日圓）<input id="price" type="number" min="0" step="1" placeholder="0"></label><label>數量<input id="qty" type="number" min="1" step="1" value="1" required></label></div><label>預計購買地點<input id="store" maxlength="120" placeholder="例如：松本清、唐吉訶德"></label><label>商品照片（選填，儲存在本機）<input id="photo" type="file" accept="image/*"></label><label>備註<textarea id="notes" rows="2" maxlength="500" placeholder="色號、規格、免稅提醒…"></textarea></label></div><div class="modal-actions"><button type="button" class="secondary" id="cancel">取消</button><button type="submit">儲存商品</button></div></form></dialog><script>
(()=>{'use strict';const KEY='japan-shopping-v1',RATE='japan-shopping-rate';let items=[];try{const data=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(data))items=data}catch{}let filter='全部',editing=null;let payments={};const PAY='japan-shopping-payments-v1';try{payments=JSON.parse(localStorage.getItem(PAY)||'{}')||{}}catch{}const $=id=>document.getElementById(id),cats=['全部','未購買','已購買','自己購物','親友代購','美妝保養','藥妝保健','零食伴手禮','服飾配件','生活雜貨','其他'];const money=n=>'¥'+Number(n||0).toLocaleString('ja-JP');const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch{alert('儲存空間不足，請縮小照片或先備份資料。')}}function render(){renderSettlement();let spent=items.filter(i=>i.bought).reduce((s,i)=>s+(+i.price||0)*(+i.qty||1),0);$('total').textContent=items.length;$('done').textContent=items.filter(i=>i.bought).length;$('spent').textContent=money(spent);$('twd').textContent='約 NT$'+Math.round(spent*(+$('rate').value||0)).toLocaleString('zh-TW');$('tabs').innerHTML=cats.map(c=>`<button class="tab ${filter===c?'active':''}" data-tab="${escape(c)}">${escape(c)}</button>`).join('');let q=$('search').value.trim().toLowerCase();let view=items.filter(i=>(filter==='全部'||(filter==='未購買'&&!i.bought)||(filter==='已購買'&&i.bought)||i.purpose===filter||i.category===filter)&&[i.name,i.brand,i.store,i.person,i.notes].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=view.length?view.map(i=>`<article class="item ${i.bought?'bought':''}">${i.photo?`<img class="thumb" src="${escape(i.photo)}" alt="商品照片">`:'<div class="thumb">🛍️</div>'}<div class="item-info"><h3>${escape(i.name)}</h3><div class="meta">${escape(i.brand||i.category)} · ${escape(i.purpose)}${i.person?' · '+escape(i.person):''}<br>${i.store?'📍 '+escape(i.store)+' · ':''}數量 ${+i.qty||1}${i.notes?'<br>📝 '+escape(i.notes):''}</div><div class="price">${money((+i.price||0)*(+i.qty||1))}</div></div><div class="item-actions"><button data-toggle="${escape(i.id)}" class="${i.bought?'secondary':''}">${i.bought?'↩ 未買':'✓ 已買'}</button><button class="secondary" data-edit="${escape(i.id)}">編輯</button><button class="ghost" data-delete="${escape(i.id)}">刪除</button></div></article>`).join(''):'<div class="empty">🩵<h3>這裡還沒有商品</h3><p>按下方按鈕，加入第一件想買的東西吧！</p></div>'}function renderSettlement(){const groups={};items.filter(i=>i.purpose==='親友代購'&&i.bought).forEach(i=>{const person=(i.person||'未指定親友').trim()||'未指定親友';(groups[person]??=[]).push(i)});const rate=Math.max(0,Number($('rate').value)||0);let due=0,received=0;const names=Object.keys(groups).sort((a,b)=>a.localeCompare(b,'zh-Hant'));$('settleList').innerHTML=names.length?names.map(person=>{const arr=groups[person],yen=arr.reduce((n,i)=>n+(Number(i.price)||0)*(Number(i.qty)||1),0),twd=Math.round(yen*rate),paid=!!payments[person];if(paid)received+=twd;else due+=twd;return `<div class="settle-row"><div><strong>${escape(person)}</strong><small>${arr.length} 種商品 · ${money(yen)} · 約 NT$${twd.toLocaleString('zh-TW')}<br><span class="${paid?'tag-paid':'tag-due'}">${paid?'✓ 已收款':'● 尚未收款'}</span></small></div><button class="${paid?'secondary':''}" data-person="${escape(encodeURIComponent(person))}">${paid?'改為未收款':'標記已收款'}</button></div>`}).join(''):'<div class="settle-empty">還沒有已購買的親友代購商品。</div>';$('settleSummary').textContent=`待收 NT$${due.toLocaleString('zh-TW')}　｜　已收 NT$${received.toLocaleString('zh-TW')}`}
$('settleList').onclick=e=>{const b=e.target.closest('[data-person]');if(!b)return;const person=decodeURIComponent(b.dataset.person);payments[person]=!payments[person];try{localStorage.setItem(PAY,JSON.stringify(payments))}catch{}render()};
function openEditor(id){editing=id||null;const i=items.find(x=>x.id===id);$('form').reset();$('modalTitle').textContent=i?'編輯商品':'新增商品';['name','brand','category','purpose','person','price','qty','store','notes'].forEach(k=>{if(i&&i[k]!==undefined)$(k).value=i[k]});$('editor').showModal()}$('add').onclick=()=>openEditor();$('cancel').onclick=()=>$('editor').close();$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){filter=b.dataset.tab;render()}};$('list').onclick=e=>{const b=e.target.closest('button');if(!b)return;let id=b.dataset.toggle||b.dataset.edit||b.dataset.delete,i=items.find(x=>x.id===id);if(!i)return;if(b.dataset.toggle){i.bought=!i.bought;save();render()}else if(b.dataset.edit)openEditor(id);else if(b.dataset.delete&&confirm('確定刪除「'+i.name+'」？')){items=items.filter(x=>x.id!==id);save();render()}};$('search').oninput=render;try{$('rate').value=localStorage.getItem(RATE)||'0.22'}catch{}$('rate').oninput=()=>{try{localStorage.setItem(RATE,$('rate').value)}catch{}render()};function resize(file){return new Promise((resolve,reject)=>{if(!file){resolve(null);return}if(file.size>15e6){reject(Error('照片太大，請選擇 15MB 以下的照片'));return}const reader=new FileReader();reader.onerror=()=>reject(Error('照片讀取失敗'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('照片格式不支援'));img.onload=()=>{const c=document.createElement('canvas'),scale=Math.min(1,800/Math.max(img.width,img.height));c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};img.src=reader.result};reader.readAsDataURL(file)})}$('form').onsubmit=async e=>{e.preventDefault();try{const old=items.find(x=>x.id===editing),photo=await resize($('photo').files[0]);const i={id:editing||('id-'+Date.now()+'-'+Math.random().toString(36).slice(2)),bought:old?.bought||false,photo:photo||old?.photo||'',...Object.fromEntries(['name','brand','category','purpose','person','price','qty','store','notes'].map(k=>[k,$(k).value.trim()]))};i.price=Math.max(0,Number(i.price)||0);i.qty=Math.max(1,Math.floor(Number(i.qty)||1));if(old)items=items.map(x=>x.id===editing?i:x);else items.unshift(i);save();$('editor').close();render()}catch(err){alert(err.message)}};$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:2,items,rate:$('rate').value,payments},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='日本購物清單備份.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const obj=JSON.parse(await f.text());if(!Array.isArray(obj.items)||obj.items.length>10000)throw Error('備份格式不正確');if(!confirm('匯入會取代目前清單，請確認已先備份。繼續嗎？'))return;items=obj.items.filter(i=>i&&typeof i==='object'&&typeof i.name==='string').map(i=>({id:String(i.id||('id-'+Math.random())),name:i.name.slice(0,100),brand:String(i.brand||'').slice(0,100),category:String(i.category||'其他'),purpose:String(i.purpose||'自己購物'),person:String(i.person||''),price:Math.max(0,Number(i.price)||0),qty:Math.max(1,Math.floor(Number(i.qty)||1)),store:String(i.store||''),notes:String(i.notes||''),bought:!!i.bought,photo:typeof i.photo==='string'&&/^data:image\/(png|jpeg|webp);base64,/.test(i.photo)?i.photo:''}));if(obj.rate&&Number(obj.rate)>0)$('rate').value=obj.rate;payments=obj.payments&&typeof obj.payments==='object'&&!Array.isArray(obj.payments)?obj.payments:{};try{localStorage.setItem(PAY,JSON.stringify(payments))}catch{}save();render();alert('匯入成功')}catch(err){alert('無法匯入：'+err.message)}finally{e.target.value=''}};render()})();
</script></body></html>
